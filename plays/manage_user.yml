---
- name: Manage automation user and SSH 
  hosts: all
  remote_user: root

  tasks:
    - name: Create the automation user and set the password
      ansible.builtin.user: 
        name: automation
        state: present
        shell: /bin/bash
        password: "{{ 'devops' | password_hash('sha512') }}"
        update_password: on_create

    - name: Install automation public key
      ansible.posix.authorized_key:
        user: automation
        state: present
        key: "{{ lookup('file', '/home/automation/.ssh/id_ed25519.pub') }}"
        path: /home/automation/.ssh/authorized_keys
        manage_dir: true

    - name: Allow automation to sudo without password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/automation
        content: "automation ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
      
   
